x-container-log-rotation: &container-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-infer-nexus-image: &infer-nexus-image
  image: infer:v5
  build:
    context: ..
    dockerfile: ascend_deploy/dockerfile
    args:
      ASCEND_BASE_IMAGE: ${ASCEND_BASE_IMAGE:-mineru:npu-latest}
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}

services:
  ray-head:
    <<: *infer-nexus-image
    user: infer-nexus
    logging: *container-log-rotation
    command:
      - bash
      - -lc
      - >
        ray start --head
        --node-ip-address=$$(hostname -i)
        --port=6379
        --dashboard-host=0.0.0.0
        --disable-usage-stats
        --temp-dir=/tmp/ray
        --block
    ports:
      - "8265:8265"
      - "8000:8000"
    environment: &ray-logging-environment
      RAY_LOGGING_CONFIG_ENCODING: JSON
      RAY_BACKEND_LOG_JSON: "1"
      RAY_ROTATION_MAX_BYTES: "52428800"
      RAY_ROTATION_BACKUP_COUNT: "3"
    volumes:
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - ../docs:/app/docs:ro
      - ../README.md:/app/README.md:ro
      - ../config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-../models}:/models
      - ray-head-temp:/tmp/ray
    healthcheck:
      test: ["CMD-SHELL", "ray status --address=127.0.0.1:6379 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ray-worker:
    <<: *infer-nexus-image
    user: infer-nexus
    logging: *container-log-rotation
    # 用户添加到设备组
    group_add:
       - "${ASCEND_DEVICE_GID:-1003}"
    privileged: true
    depends_on:
      ray-head:
        condition: service_healthy
    command:
      # 权限执行问题，由sh改为bash
      - bash
      - -lc
      - >
        set -eu;
        if [ -z "$${ASCEND_RT_VISIBLE_DEVICES:-}" ]; then
          echo "ASCEND_RT_VISIBLE_DEVICES must define the infer-nexus NPU pool, for example: 0,1,2,3." >&2;
          exit 1;
        fi;
        DERIVED_NUM_NPUS=$$(python -c "import os; v=os.environ.get('ASCEND_RT_VISIBLE_DEVICES',''); print(len([x for x in v.split(',') if x.strip()]))");
        if [ "$${DERIVED_NUM_NPUS}" -le 0 ]; then
          echo "ASCEND_RT_VISIBLE_DEVICES must contain at least one device id." >&2;
          exit 1;
        fi;
        RESOURCE_ARGS="--resources={\"NPU\":$${DERIVED_NUM_NPUS}}";
        RAY_HEAD_IP=$$(python -c "import socket; print(socket.gethostbyname('ray-head'))");
        RAY_ADDRESS="$${RAY_HEAD_IP}:6379";
        ray start --address="$${RAY_ADDRESS}"
        --node-ip-address=$$(hostname -i)
        --disable-usage-stats
        --temp-dir=/tmp/ray
        $$RESOURCE_ARGS
        --block
    environment:
      ASCEND_RT_VISIBLE_DEVICES: ${ASCEND_RT_VISIBLE_DEVICES:?ASCEND_RT_VISIBLE_DEVICES must define the infer-nexus NPU pool}
      RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES: ${RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES:-1}
      RAY_LOGGING_CONFIG_ENCODING: JSON
      RAY_BACKEND_LOG_JSON: "1"
      RAY_ROTATION_MAX_BYTES: "52428800"
      RAY_ROTATION_BACKUP_COUNT: "3"
    devices:
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    volumes:
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - ../docs:/app/docs:ro
      - ../README.md:/app/README.md:ro
      - ../config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-../models}:/models
      - ray-worker-temp:/tmp/ray
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool:ro
    healthcheck:
      test: ["CMD-SHELL", "RAY_HEAD_IP=$$(python -c \"import socket; print(socket.gethostbyname('ray-head'))\"); ray status --address=$${RAY_HEAD_IP}:6379 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  serve-deployer:
    <<: *infer-nexus-image
    user: infer-nexus
    logging: *container-log-rotation
    environment: *ray-logging-environment
    depends_on:
      ray-head:
        condition: service_healthy
      ray-worker:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        set -eu;
        trap 'ray stop --force >/dev/null 2>&1 || true' EXIT;
        RAY_HEAD_IP=$$(python -c "import socket; print(socket.gethostbyname('ray-head'))");
        RAY_ADDRESS="$${INFER_NEXUS_RAY_ADDRESS:-$${RAY_HEAD_IP}:6379}";
        ray start --address="$${RAY_ADDRESS}"
        --node-ip-address=$$(hostname -i)
        --temp-dir=/tmp/ray
        --num-cpus=0
        --disable-usage-stats;
        python scripts/run_serve_runtime.py
        --settings config/settings.ascend-compose.yaml
        --ray-address "$${RAY_ADDRESS}"
        --proxy-location HeadOnly
        --ready-timeout-seconds ${SERVE_READY_TIMEOUT_SECONDS:-900}
    volumes:
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - ../docs:/app/docs:ro
      - ../README.md:/app/README.md:ro
      - ../config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-../models}:/models
      - ray-deployer-temp:/tmp/ray
    restart: "no"

volumes:
  ray-head-temp:
  ray-worker-temp:
  ray-deployer-temp:
