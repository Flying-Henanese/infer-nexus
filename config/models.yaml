models:
  - name: Qwen3-VL-8B-Instruct
    alias: qwen3-vl-chat-8b-instruct
    task: chat
    backend: vllm
    model_path: /nas_data/zhousj/qwen-vl
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 10000
    cpu_per_replica: 4
    gpu_per_replica: 0.4
    gpu_memory_utilization: 0.35
    min_replicas: 1
    max_replicas: 1
    capabilities:
      - vision
    labels:
      - internal
      - llm

  - name: Qwen3-32B
    alias: qwen3-32b
    task: chat
    backend: vllm
    model_path: /nas_data/models/Qwen/Qwen3-32B
    dtype: auto
    tensor_parallel_size: 1
    max_model_len: 4096
    cpu_per_replica: 4
    gpu_per_replica: 0.9
    gpu_memory_utilization: 0.9
    min_replicas: 1
    max_replicas: 1
    vllm:
      engine_kwargs:
        enable_auto_tool_choice: true
        tool_call_parser: hermes
      request_defaults:
        tool_choice: auto
        parallel_tool_calls: true
        chat_template_kwargs:
          enable_thinking: false
      request_policy:
        allow_tools: true
        allow_reasoning: true
      openai_serving:
        enabled: true
    labels:
      - internal
      - llm
      
  - name: MinerU2.5-2509-1.2B
    alias: mineru
    task: chat
    backend: vllm
    model_path: /nas_data/zhousj/mineru
    dtype: auto
    tensor_parallel_size: 1
    max_model_len: 8192
    cpu_per_replica: 4
    gpu_per_replica: 0.35
    gpu_memory_utilization: 0.35
    min_replicas: 1
    max_replicas: 2
    capabilities:
      - vision
    engine_kwargs:
      trust_remote_code: true
      limit_mm_per_prompt:
        image: 10
    labels:
      - multimodal
      - ocr
      - llm

  - name: qwen3-embedding-8b
    alias: qwen3-embedding-8b
    task: embedding
    backend: vllm
    model_path: /nas_data/models/Qwen/Qwen3-Embedding-8B
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    cpu_per_replica: 2
    gpu_per_replica: 0.3
    gpu_memory_utilization: 0.3
    min_replicas: 1
    max_replicas: 1
    labels:
      - internal
      - embedding

  - name: bge-reranker-large
    alias: bge-reranker
    task: rerank
    backend: vllm
    model_path: /nas_data/models/bge-reranker-large
    dtype: float16
    tensor_parallel_size: 1
    max_model_len: 512
    cpu_per_replica: 4
    gpu_per_replica: 0.2
    gpu_memory_utilization: 0.2
    min_replicas: 1
    max_replicas: 1
    engine_kwargs:
      trust_remote_code: true  
    labels:
      - internal
      - rerank

  - name: Qwen3.5-9B
    alias: qwen3.5-9b
    task: chat
    backend: vllm
    model_path: /nas_data/models/Qwen/Qwen3.5-9B
    dtype: auto
    tensor_parallel_size: 1
    max_model_len: 8192
    cpu_per_replica: 4
    gpu_per_replica: 0.7
    gpu_memory_utilization: 0.7
    min_replicas: 1
    max_replicas: 1
    capabilities:
      - vision
    engine_kwargs:
      trust_remote_code: true
      limit_mm_per_prompt:
        image: 10
    vllm:
      request_policy:
        allow_reasoning: true
    labels:
      - internal
      - llm
      - multimodal
