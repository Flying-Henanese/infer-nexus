models:
  - name: qwen3-32b-instruct
    alias: qwen3-chat
    task: chat
    backend: vllm
    model_path: Qwen/Qwen3-32B-Instruct
    dtype: bfloat16
    tensor_parallel_size: 4
    max_model_len: 32768
    cpu_per_replica: 8
    gpu_per_replica: 4
    min_replicas: 1
    max_replicas: 2
    capabilities:
      - streaming
    labels:
      - internal
      - llm

  - name: bge-large-zh-v1_5
    alias: bge-embedding
    task: embedding
    backend: vllm
    model_path: BAAI/bge-large-zh-v1.5
    dtype: float16
    tensor_parallel_size: 1
    max_model_len: 8192
    cpu_per_replica: 4
    gpu_per_replica: 1
    min_replicas: 1
    max_replicas: 2
    labels:
      - internal
      - embedding

  - name: bge-reranker-v2-m3
    alias: bge-rerank
    task: rerank
    backend: vllm
    model_path: BAAI/bge-reranker-v2-m3
    dtype: float16
    tensor_parallel_size: 1
    max_model_len: 4096
    cpu_per_replica: 4
    gpu_per_replica: 1
    min_replicas: 1
    max_replicas: 2
    labels:
      - internal
      - rerank
