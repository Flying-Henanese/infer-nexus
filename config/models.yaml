  - name: qwen3-reranker-8b
    alias: qwen3-rerank
    task: rerank
    backend: vllm
    model_path: /nas_data/models/Qwen/Qwen3-Reranker-8B
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 4096
    cpu_per_replica: 4
    gpu_per_replica: 0.3
    gpu_memory_utilization: 0.3
    min_replicas: 1
    max_replicas: 1
    vllm:
      engine_kwargs:
        hf_overrides:
          architectures:
            - Qwen3ForSequenceClassification
          classifier_from_token:
            - "no"
            - "yes"
          is_original_qwen3_reranker: true
    labels:
      - internal
      - rerank

