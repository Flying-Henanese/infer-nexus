  # 其余模型在模型路径与共享加速器池完成多模型验证后再启用。
  - name: Qwen3.8-27B
    alias: qwen3.8-27b
    task: chat
    backend: vllm
    compat_mode: vllm_native
    model_path: Qwen/Qwen3.8-27B
    dtype: auto
    tensor_parallel_size: 2
    max_model_len: 30000
    cpu_per_replica: 8
    # 映射为 Ray 资源 NPU: 2，一个副本独占整个 2 卡 NPU 池
    gpu_per_replica: 2
    gpu_memory_utilization: 0.95
    min_replicas: 1
    max_replicas: 1
    deployment_config:
      serve_deployment_kwargs:
        max_queued_requests: 16
        max_ongoing_requests: 2
    labels:
      - internal
      - llm
    vllm:
      engine_kwargs:
        # 对应 vllm serve --speculative-config
        speculative_config:
          method: qwen3_5_mtp
          num_speculative_tokens: 3
          enforce_eager: true
        # 对应 vllm serve --compilation-config
        compilation_config:
          cudagraph_mode: FULL_DECODE_ONLY
        # 对应 vllm serve --additional-config
        # 这里是ascend平台的numa绑定配置，vllm在ascend平台上运行时需要开启
        additional_config:
          enable_cpu_binding: true
      openai_serving:
        enabled: true

