service:
  name: infer-nexus
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  api_key_header: X-API-Key

catalog:
  models_path: config/models.yaml

cluster:
  inference_device_type: cuda
  device_pool_boundary: ray_runtime_visible_devices
  default_platform: cuda

scheduler:
  # Enable request admission control to protect runtime under overload.
  enable_admission_control: true
  # Cooldown (seconds) before allowing another scale-up decision.
  scale_up_cooldown_sec: 30
  # Cooldown (seconds) before allowing another scale-down decision.
  scale_down_cooldown_sec: 300
  # Queue length threshold used as a scaling pressure signal.
  queue_length_threshold: 8
  # TTFT threshold in milliseconds (Time To First Token).
  ttft_threshold_ms: 2500
  # P95 end-to-end latency threshold in milliseconds.
  p95_latency_threshold_ms: 10000

runtime:
  device_env_strategy: ray_managed
  backend: vllm
  # Stub-only: skips real model execution and uses mocked runtime responses.
  # Useful for local API contract testing and integration without GPU/models.
  # For real environment, switch to `serve` to enable real inference execution.
  execution_mode: serve
  # Stub-only: skips real backend initialization (e.g., loading vLLM/runtime stack)
  # so the service can start quickly for simulation and workflow debugging.
  # For real environment, switch to `real` to initialize the actual backend engine.
  backend_init_mode: real
  # Gateway-side timeout for one Ray Serve handle call. This prevents requests
  # from waiting forever when the Serve router or replica stops making progress.
  serve_request_timeout_seconds: 120
  # 0 disables the gateway-side per-model inflight limiter.
  max_inflight_per_model: 0
  # Optional gateway-side circuit breaker for repeated Serve runtime failures.
  circuit_breaker_enabled: false
  circuit_breaker_failure_threshold: 3
  circuit_breaker_cooldown_seconds: 60

model_store:
  root_dir: models
  # use mirror endpoint to prevent blocking in mainland China
  huggingface_endpoint: https://hf-mirror.com
