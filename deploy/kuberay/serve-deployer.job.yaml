# Apply this one-shot RayJob only when (re)submitting the pre-registered
# infer-nexus Serve applications.  Do not include it in routine RayCluster
# scaling updates: re-running it can roll model replicas even with unchanged
# catalog entries.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: infer-nexus-serve-deployer
  namespace: ray
  labels:
    app.kubernetes.io/name: infer-nexus
    app.kubernetes.io/component: serve-deployer
spec:
  clusterSelector:
    ray.io/cluster: infer-nexus-ray
  entrypoint: >-
    python scripts/run_serve_runtime.py
    --settings config/settings.k8s.yaml
    --ray-address auto
    --ready-timeout-seconds 1800
  # The driver runs inside this RayCluster. Reserving one CPU here fragments
  # the only empty 8-CPU worker and blocks the Qwen3.5-9B replica (8 CPU).
  entrypointNumCpus: 0
