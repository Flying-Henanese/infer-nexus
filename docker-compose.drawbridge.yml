# drawbridge 专用 Compose 文件。
# drawbridge 会把注册的 compose 原样扁平化到 <release>/ 根目录执行，且不改写相对路径；
# 因此本文件的相对路径一律以仓库根为基准，与 ascend_deploy/docker-compose.yml（以 ascend_deploy/
# 为基准）不可混用。手动使用时同样从仓库根执行：
#   docker compose -f docker-compose.drawbridge.yml up
x-container-log-rotation: &container-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-infer-nexus-image: &infer-nexus-image
  image: infer-nexus:v6.1_vllm_0.23
  build:
    context: .
    dockerfile: ascend_deploy/dockerfile
    args:
      ASCEND_BASE_IMAGE: ${ASCEND_BASE_IMAGE:-quay.io/ascend/vllm-ascend:v0.23.0}
      APP_UID: ${APP_UID:-1004}
      APP_GID: ${APP_GID:-1005}

services:
  # /tmp/ray 的命名卷只保留首次填充时的属主：镜像重建或 APP_UID/APP_GID 调整都
  # 不会更新已有卷，root 调试容器写入的文件也会留在卷里。属主与 infer-nexus 不一致时，
  # ray start 会在写 /tmp/ray/ray_current_cluster 时报 Permission denied。
  # 该一次性 init 以 root 把三个卷的属主校正回镜像内的 infer-nexus 用户。
  ray-tmp-init:
    <<: *infer-nexus-image
    user: "0"
    logging: *container-log-rotation
    restart: "no"
    command:
      - bash
      - -lc
      - chown -R infer-nexus:infer-nexus /fix/ray-head /fix/ray-worker /fix/ray-deployer
    volumes:
      - ray-head-temp:/fix/ray-head
      - ray-worker-temp:/fix/ray-worker
      - ray-deployer-temp:/fix/ray-deployer

  ray-head:
    <<: *infer-nexus-image
    user: infer-nexus
    depends_on:
      ray-tmp-init:
        condition: service_completed_successfully
    logging: *container-log-rotation
    command:
      - bash
      - -lc
      - >
        ray start --head
        --node-ip-address=$$(hostname -i)
        --port=6379
        --dashboard-host=0.0.0.0
        --disable-usage-stats
        --temp-dir=/tmp/ray
        --block
    ports:
      - "8265:8265"
      - "18000:8000"
    environment: &ray-logging-environment
      RAY_LOGGING_CONFIG_ENCODING: JSON
      RAY_BACKEND_LOG_JSON: "1"
      RAY_ROTATION_MAX_BYTES: "52428800"
      RAY_ROTATION_BACKUP_COUNT: "3"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-/data1/models}:/models
      - ray-head-temp:/tmp/ray
    healthcheck:
      test: ["CMD-SHELL", "ray status --address=127.0.0.1:6379 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ray-worker:
    <<: *infer-nexus-image
    user: infer-nexus
    logging: *container-log-rotation
    # NPU 池边界由 ascend-docker-runtime 定义：按 ASCEND_VISIBLE_DEVICES 只挂载选中 NPU
    # 的设备节点（/dev/davinci* + davinci_manager/devmm_svm/hisi_hdc）并注入宿主机驱动、
    # /var/dcmi、/etc/ascend_install.info 等路径（此前手动维护的 devices 清单与驱动挂载已删除），
    # 同时在宿主机配置 device cgroup 隔离。前置条件：宿主机已注册 ascend runtime。
    runtime: ascend
    # 设备组仍需保留：runtime 负责挂载节点，节点访问权限来自宿主机设备属组。
    group_add:
       - "${ASCEND_DEVICE_GID:-1003}"
    # /dev/shm 提升到 1g，避免 Ray 对象存储因默认 64MB 回退磁盘。
    shm_size: "1g"
    depends_on:
      ray-head:
        condition: service_healthy
    # NPU 资源计数从容器内可见的 /dev/davinci[0-9]+ 节点数推导（与 runtime 挂载一致），
    # 避免池声明与实际可见性脱节。
    command:
      # 权限执行问题，由sh改为bash
      - bash
      - -lc
      - >
        set -eu;
        unset ASCEND_RT_VISIBLE_DEVICES;
        DERIVED_NUM_NPUS=$$(find /dev -maxdepth 1 -name 'davinci[0-9]*' 2>/dev/null | wc -l | tr -d ' ');
        if [ "$${DERIVED_NUM_NPUS}" -le 0 ]; then
          echo "No /dev/davinci[0-9]+ devices visible in ray-worker; check ASCEND_VISIBLE_DEVICES and the ascend runtime." >&2;
          exit 1;
        fi;
        RESOURCE_ARGS="--resources={\"NPU\":$${DERIVED_NUM_NPUS}}";
        RAY_HEAD_IP=$$(python -c "import socket; print(socket.gethostbyname('ray-head'))");
        RAY_ADDRESS="$${RAY_HEAD_IP}:6379";
        ray start --address="$${RAY_ADDRESS}"
        --node-ip-address=$$(hostname -i)
        --disable-usage-stats
        --temp-dir=/tmp/ray
        $$RESOURCE_ARGS
        --block
    environment:
      # NPU 池选择，由 ascend-docker-runtime 接管。注意不是 ASCEND_RT_VISIBLE_DEVICES：
      # 当前 24.1.rc2 驱动 + CANN 9.1.0 栈上该变量本身会导致非 root 枚举归零；runtime
      # 不注入它，启动脚本中的 unset 防护 Ray 侧注入，二者共同保证它不出现在运行环境。
      ASCEND_VISIBLE_DEVICES: ${ASCEND_VISIBLE_DEVICES:-4,5}
      RAY_LOGGING_CONFIG_ENCODING: JSON
      RAY_BACKEND_LOG_JSON: "1"
      RAY_ROTATION_MAX_BYTES: "52428800"
      RAY_ROTATION_BACKUP_COUNT: "3"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-/data1/models}:/models
      - ray-worker-temp:/tmp/ray
    healthcheck:
      test: ["CMD-SHELL", "RAY_HEAD_IP=$$(python -c \"import socket; print(socket.gethostbyname('ray-head'))\"); ray status --address=$${RAY_HEAD_IP}:6379 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  serve-deployer:
    <<: *infer-nexus-image
    user: infer-nexus
    logging: *container-log-rotation
    environment: *ray-logging-environment
    depends_on:
      ray-head:
        condition: service_healthy
      ray-worker:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        set -eu;
        trap 'ray stop --force >/dev/null 2>&1 || true' EXIT;
        RAY_HEAD_IP=$$(python -c "import socket; print(socket.gethostbyname('ray-head'))");
        RAY_ADDRESS="$${INFER_NEXUS_RAY_ADDRESS:-$${RAY_HEAD_IP}:6379}";
        ray start --address="$${RAY_ADDRESS}"
        --node-ip-address=$$(hostname -i)
        --temp-dir=/tmp/ray
        --num-cpus=0
        --disable-usage-stats;
        python scripts/run_serve_runtime.py
        --settings config/settings.ascend-compose.yaml
        --ray-address "$${RAY_ADDRESS}"
        --proxy-location HeadOnly
        --ready-timeout-seconds ${SERVE_READY_TIMEOUT_SECONDS:-900}
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ./config:/app/config:ro
      - ${MODEL_STORE_HOST_PATH:-/data1/models}:/models
      - ray-deployer-temp:/tmp/ray
    restart: "no"

volumes:
  ray-head-temp:
  ray-worker-temp:
  ray-deployer-temp:
