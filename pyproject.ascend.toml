[project]
name = "infer-nexus"
version = "0.1.0"
description = "Shared inference service factory built on Ray Serve and vLLM Ascend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3>=1.43.19",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "pyarrow>=24.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.30.0",
  # 以下为监控所需依赖
  "matplotlib>=3.9.0",
  "plotly>=5.24.0",
  "py-spy>=0.4.0",
  "tensorboard>=2.18.0"
]

[project.optional-dependencies]
# huggingface-hub去除，使用镜像自带版本
artifacts = []
ascend-image = []
ascend-monitoring = [
  "matplotlib>=3.9.0",
  "plotly>=5.24.0",
  "py-spy>=0.4.0",
  "tensorboard>=2.18.0",
]
# for development only
# not required for real production use
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infer_nexus"]

[tool.uv]
default-groups = []
# 适配低版本ray,避免自动升级
# setuptools仅适用于vllm-ascend=0.18及以下
constraint-dependencies = [
  "protobuf==6.33.6",
  "setuptools<82.0"
]


# following items are provided by the Ascend base image and must stay out of
# dependency installation targets. The Ascend Dockerfile exports requirements,
# removes these package names, and installs only the cleaned application deps.
# they will not affect project dependencies.
[tool.infer-nexus.ascend-image]
base = "Mineru-optimization"
source = "https://ai.gitcode.com/Ascend-SACT/Mineru-optimization"
runtime_packages_provided_by_image = [
  "torch==2.9.0+cpu",
  "torch-npu==2.9.0.post1+gitee7ba04",
  "torchaudio==2.9.0",
  "torchvision==0.24.0",
  "transformers==4.57.6",
  "vllm==0.18.0+empty",
  "vllm-ascend==0.18.0rc1",
]

[[tool.uv.index]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
