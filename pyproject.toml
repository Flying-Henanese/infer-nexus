[project]
name = "infer-nexus"
version = "0.1.0"
description = "Shared inference service factory built on Ray Serve and vLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43.19",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "pyarrow>=24.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
artifacts = [
  "huggingface_hub>=0.32.0",
]
serve = [
  "ray[serve]>=2.30.0",
]
vllm = [
  "vllm>=0.18.0,<0.19.0",
  "transformers>=4.44.0",
]
cuda-monitoring = [
  "matplotlib>=3.9.0",
  "nvidia-ml-py>=12.560.30",
  "numpy>=2.0.0",
  "nvtx>=0.2.10",
  "pandas>=2.2.0",
  "psutil>=6.0.0",
  "tensorboard>=2.18.0",
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infer_nexus"]

[tool.uv]
default-groups = []
extra-build-dependencies = { xformers = ["torch"] }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
